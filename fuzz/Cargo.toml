[package]
name = "tokenkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokenkit = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[[bin]]
name = "fuzz_jwt_decode"
path = "fuzz_targets/fuzz_jwt_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jwt_encode"
path = "fuzz_targets/fuzz_jwt_encode.rs"
test = false
doc = false
